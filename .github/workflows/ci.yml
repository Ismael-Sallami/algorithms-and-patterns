# Compiles and runs the 57 reference implementations on every push. Each one
# asserts its own behaviour, so the badge means the catalogue was executed, not
# just that it parses.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run every reference implementation
        run: bash scripts/verify.sh

      # Antes este paso solo imprimia las cuentas, lo que no comprueba nada: el
      # README podia decir 183 con 198 carpetas en el arbol y seguia en verde.
      - name: The counts in the README still match the tree
        run: python3 scripts/check-counts.py

      # Los enlaces de procedencia estuvieron rotos meses sin que nada avisara:
      # ocho repositorios cambiaron de nombre y de estructura a la vez.
      - name: Every provenance link still resolves
        run: bash scripts/check-links.sh
